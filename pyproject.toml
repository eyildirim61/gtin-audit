[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "gtin-audit"
version = "0.1.0"
description = "Find barcode (GTIN/EAN/UPC) and packaging errors in product master data exports."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["gtin", "ean", "barcode", "gs1", "data-quality", "master-data", "odoo", "erp"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Office/Business",
  "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
xlsx = ["openpyxl>=3.1"]
dev = ["pytest>=7", "openpyxl>=3.1"]

[project.scripts]
gtin-audit = "gtin_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
